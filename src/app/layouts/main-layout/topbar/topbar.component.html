<header class="border-b border-gray-200 bg-white/95 px-4 py-3 backdrop-blur sm:px-6 dark:border-gray-700 dark:bg-slate-900/95">
    <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <button type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-md border border-gray-200 bg-white text-gray-600 transition-colors hover:bg-gray-50 md:hidden dark:border-gray-700 dark:bg-slate-800 dark:text-gray-100 dark:hover:bg-slate-700"
                (click)="openSidebar()" aria-label="Open sidebar" title="Menu">
						<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
							<path d="M3 6h18M3 12h18M3 18h18"></path>
						</svg>
					</button>

            <div class="rounded-lg bg-primary-100 px-2 py-1 text-sm font-bold tracking-wide text-primary-700">
                HRMS
            </div>
            <p class="hidden text-sm text-gray-500 lg:block dark:text-gray-300">Human Resource Management</p>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <button type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-md border border-gray-200 bg-white text-gray-600 transition-colors hover:bg-gray-50 dark:border-gray-700 dark:bg-slate-800 dark:text-gray-100 dark:hover:bg-slate-700"
                (click)="toggleTheme()" [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'" [title]="isDark() ? 'Light mode' : 'Dark mode'">
						@if (isDark()) {
							<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
								<circle cx="12" cy="12" r="4"></circle>
								<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
							</svg>
						} @else {
							<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
								<path d="M21 12.79A9 9 0 1 1 11.21 3c0 .07-.01.14-.01.21A7 7 0 0 0 20.79 12c.07 0 .14 0 .21-.01Z"></path>
							</svg>
						}
					</button>

            <div class="flex items-center gap-2 rounded-md border border-gray-200 bg-white px-2 py-2 sm:px-3 dark:border-gray-700 dark:bg-slate-800">
                <span class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-primary-100 text-primary-700 dark:bg-primary-900 dark:text-primary-100">
							<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
								<circle cx="12" cy="8" r="4"></circle>
								<path d="M4 20c1.8-3.4 4.8-5 8-5s6.2 1.6 8 5"></path>
							</svg>
						</span>

                <div class="hidden sm:block">
                    <p class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ userName() }}</p>
                    <p class="text-xs text-gray-500 dark:text-gray-300">{{ userRole() }}</p>
                </div>
            </div>

            <button type="button" class="h-10 w-10 items-center justify-center rounded-md border border-red-200 bg-red-50 text-red-600 transition-colors hover:bg-red-100 sm:inline-flex dark:border-red-400/30 dark:bg-red-500/10 dark:text-red-300 dark:hover:bg-red-500/20"
                (click)="logout()" aria-label="Logout" title="Logout">
						<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
							<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
							<path d="M16 17l5-5-5-5"></path>
							<path d="M21 12H9"></path>
						</svg>
					</button>
        </div>
    </div>
</header>
