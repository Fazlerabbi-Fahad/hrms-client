<aside class="flex h-full w-full flex-col border-r border-gray-200 bg-white dark:border-gray-700 dark:bg-slate-900">
    <div class="flex items-center justify-between px-4 py-5">
        <div class="inline-flex items-center rounded-lg bg-primary-100 px-3 py-2 text-base font-bold tracking-wide text-primary-700 dark:bg-primary-900 dark:text-primary-100">
            HRMS
        </div>

        @if (showCloseButton()) {
        <button type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-600 transition-colors hover:bg-gray-50 dark:border-gray-700 dark:bg-slate-800 dark:text-gray-100 dark:hover:bg-slate-700"
            (click)="closeRequested.emit()" aria-label="Close sidebar">
						<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
							<path d="M18 6 6 18M6 6l12 12"></path>
						</svg>
					</button> }
    </div>

    <nav class="flex-1 px-3 pb-4" aria-label="Primary">
        <ul class="space-y-1">
            @for (item of navItems; track item.route) {
            <li>
                <a class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-slate-800 dark:hover:text-gray-100" [routerLink]="item.route" (click)="onNavClick()"
                    routerLinkActive="bg-primary-50 text-primary-700 dark:bg-primary-900/40 dark:text-primary-100" [routerLinkActiveOptions]="{ exact: true }">
                    <span class="text-base leading-none" [attr.aria-hidden]="true">{{ item.icon }}</span>
                    <span>{{ item.label }}</span>
                </a>
            </li>
            }
        </ul>
    </nav>

    <div class="border-t border-gray-200 p-3 dark:border-gray-700">
        <button type="button" class="flex w-full items-center justify-center gap-2 rounded-xl border border-red-200 bg-red-50 px-3 py-2.5 text-sm font-medium text-red-600 transition-colors hover:bg-red-100 dark:border-red-400/30 dark:bg-red-500/10 dark:text-red-300 dark:hover:bg-red-500/20"
            (click)="logout()">
					<span aria-hidden="true">⎋</span>
					<span>Logout</span>
				</button>
    </div>
</aside>
